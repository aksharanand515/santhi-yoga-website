# Muscle atlas. Attachments and actions follow standard anatomy texts (Moore et al. 2018; Neumann 2017;
# Standring 2021). Sketch spindles are schematic locations on the manual's figure, not dissections.
# Anchors: [segment, fraction 0..1 from proximal, side (ant|post|mid), optional depth factor]

- id: trunk
  title: Breathing and trunk
  intro: "The diaphragm and abdominal wall work together in breathing, in regulating intra-abdominal pressure and in moving and stabilising the trunk."
  muscles:
    - name: Diaphragm
      latin: diaphragma
      origin: "Xiphoid process; inner surfaces of the lower six costal cartilages and ribs; lumbar vertebrae L1–L3 via the right crus and L1–L2 via the left crus, and the arcuate ligaments."
      insertion: "Its own central tendon."
      actions: "Principal muscle of inspiration: contracts and descends, enlarging the thorax. Helps raise intra-abdominal pressure (with the abdominal wall and pelvic floor) for posture, lifting, coughing and elimination. Supplied by the phrenic nerve (C3–C5)."
      role: "Every breath; the central muscle of prāṇāyāma; works with the abdominal wall in kapālabhāti, uḍḍīyāna bandha and full yogic breathing."
      train: "Neither “stretched” nor strengthened in the usual sense; its coordination and endurance respond to breathing practice."
      asanas: "All; especially śavāsana breathing, full yogic breath, prāṇāyāma, and inversions (where it works against the weight of the abdominal organs)."
      myth: "“Belly breathing uses the diaphragm; chest breathing doesn’t.” The diaphragm contracts in every inhalation; belly and chest describe *where* the volume change is most visible (@ch:breathing)."
      sketch: {pose: tadasana, spindles: [{from: [ut, 0.22, post], to: [ut, 0.30, ant], w: 1.6, kind: active}]}
    - name: Rectus abdominis
      latin: m. rectus abdominis
      origin: "Pubic crest and pubic symphysis."
      insertion: "Xiphoid process and costal cartilages of ribs 5–7."
      actions: "Flexes the trunk; tilts the pelvis posteriorly; compresses the abdomen; assists forced exhalation."
      role: "Stabilises the pelvis in leg raises and boat; lengthened in cobra, bow, fish, camel and wheel."
      train: "Strengthened by leg raises, boat and plank; lengthened eccentrically in backbends."
      asanas: "Leg raises, navāsana, plank (isometric); bhujaṅgāsana, dhanurāsana, matsyāsana (lengthening)."
      myth: "“The six-pack is the core.” Trunk stability depends on coordinated action of many muscles, and on timing more than maximal strength [@lederman2010]."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.05, ant], to: [ut, 0.8, ant], w: 1.8, kind: active}]}
    - name: Transversus abdominis
      latin: m. transversus abdominis
      origin: "Inner surfaces of the lower six costal cartilages; thoracolumbar fascia; anterior iliac crest; lateral inguinal ligament."
      insertion: "Linea alba (via its aponeurosis) and pubic crest."
      actions: "Compresses the abdomen and raises intra-abdominal pressure; assists forced exhalation. Produces little movement of the trunk."
      role: "The “drawing in” of the lower abdomen; active in kapālabhāti exhalations, in uḍḍīyāna (with the other abdominal muscles) and in maintaining trunk stiffness in arm balances."
      train: "Trained through breathing practices and through any posture requiring trunk stability."
      asanas: "Kapālabhāti, plank, crow, leg raises."
      myth: "“You must pre-tense the TrA before every movement to protect your back.” Delayed TrA timing was found in people with back pain [@hodges1996], but constant bracing is neither natural nor shown to prevent pain; flexible, well-timed control is the aim [@lederman2010]."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.2, post], to: [lt, 0.5, ant], w: 2.4, kind: active}]}
    - name: External and internal obliques
      latin: mm. obliquus externus et internus abdominis
      origin: "External: outer surfaces of ribs 5–12. Internal: thoracolumbar fascia, anterior iliac crest, lateral inguinal ligament."
      insertion: "External: linea alba, pubic tubercle, anterior iliac crest. Internal: lower borders of ribs 10–12, linea alba, pubis."
      actions: "Both sides together: flex the trunk and compress the abdomen. One side: lateral flexion to the same side; the **external** oblique rotates the trunk to the **opposite** side, the **internal** oblique to the **same** side."
      role: "Prime movers of twisting: turning to the left uses the right external and left internal obliques. Work in side bends and side plank; lengthened on the upper side in triangle."
      train: "Strengthened in twists performed actively, side plank and leg raises with rotation."
      asanas: "Ardha matsyendrāsana, trikoṇāsana, side plank, revolved postures."
      myth: "“Twists wring toxins out of the organs.” There is no evidence for this [[S]]; twists move the spine and ribs and work the obliques."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.3, ant], to: [ut, 0.55, mid], w: 2.2, kind: active}]}
    - name: Erector spinae
      latin: mm. erector spinae (iliocostalis, longissimus, spinalis)
      origin: "A broad common tendon from the posterior iliac crest, the back of the sacrum and the lumbar spinous processes."
      insertion: "Ribs; transverse and spinous processes of the vertebrae; mastoid process (longissimus capitis)."
      actions: "Both sides: extend the spine and resist flexion (eccentrically controlling forward bending). One side: lateral flexion."
      role: "Lift the chest in cobra and locust; control the descent into forward bends. At the end of a full relaxed forward bend they fall quiet and passive tissues bear the load (the “flexion–relaxation” phenomenon)."
      train: "Strengthened in locust, cobra without the hands, bow; lengthened in forward bends and child’s pose."
      asanas: "Śalabhāsana, bhujaṅgāsana, dhanurāsana (working); paścimottānāsana, pāda hastāsana (lengthening)."
      myth: "“Backbends are done by the back muscles alone.” Hip extensors, the upper-back and shoulder muscles and the breath all contribute; the extensors of the lower back should not do all the work."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.1, post], to: [ut, 0.95, post], w: 2.0, kind: active}]}
    - name: Multifidus
      latin: mm. multifidi
      origin: "Sacrum, posterior superior iliac spine, mammillary processes of the lumbar vertebrae, transverse processes of the thoracic vertebrae and articular processes of C4–C7."
      insertion: "Spinous processes two to four segments higher."
      actions: "Stabilises and extends individual spinal segments; minor rotation. Thickest in the lumbar region."
      role: "Segmental control in all postures; active in locust and in “bird-dog” (opposite arm and leg lifted from tabletop)."
      train: "Low-load holding positions (tabletop limb lifts, half locust) and graded extension."
      asanas: "Ardha śalabhāsana, cat–cow, tabletop variations."
      myth: "“You need special exercises to isolate the multifidus.” Research links multifidus changes to back pain, but general graded exercise, including yoga, is as effective as specific “stabilisation” programmes for most people [@lederman2010]."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.0, post, 0.6], to: [lt, 0.9, post, 0.6], w: 1.4, kind: active}]}
    - name: Quadratus lumborum
      latin: m. quadratus lumborum
      origin: "Posterior iliac crest and iliolumbar ligament."
      insertion: "12th rib and transverse processes of L1–L4."
      actions: "One side: lateral flexion of the trunk; “hikes” the hip. Both sides: extend the lumbar spine; fix the 12th rib during inspiration."
      role: "Lengthened on the upper side in triangle and side bends; works in balancing on one leg to keep the pelvis level (with gluteus medius)."
      train: "Side bends and side plank; lengthened in trikoṇāsana and seated side bends."
      asanas: "Trikoṇāsana, pārśva bends, gate pose."
      myth: "“QL is always the cause of low back pain.” Back pain is rarely attributable to a single muscle [@nice2016]."
      sketch: {pose: front, spindles: [{from: [lt, 0.05, post], to: [ut, 0.25, mid], w: 1.8, kind: stretch}]}

- id: hip
  title: Hip and pelvis
  intro: "The muscles around the hip are among the strongest in the body; they position the pelvis and therefore the lumbar spine."
  muscles:
    - name: Psoas major
      latin: m. psoas major
      origin: "Sides of the bodies of T12–L5 and the intervening discs; transverse processes of L1–L5."
      insertion: "Lesser trochanter of the femur (together with iliacus, as the iliopsoas)."
      actions: "Flexes the hip; with the thigh fixed, flexes the trunk on the thigh (as in sitting up from lying). Its effect on the lumbar spine is small and position-dependent; it contributes to lumbar stability [@neumann2017]."
      role: "Works in leg raises, boat and lifting the knee; lengthened in the back leg of lunges and warrior I, in bridge, bow, camel and wheel."
      train: "Strengthen with leg raises and navāsana; lengthen in low lunge with the pelvis tucked slightly under."
      asanas: "Leg raises, navāsana (working); aśva sañcalanāsana, setu bandha, dhanurāsana (lengthening)."
      myth: "“The psoas stores trauma and emotions.” This popular claim has no scientific basis [[S]]."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.75, post, -0.1], to: [th1, 0.1, mid], w: 2.4, kind: active}]}
    - name: Iliacus
      latin: m. iliacus
      origin: "Iliac fossa, inner lip of the iliac crest and the ala of the sacrum."
      insertion: "Lesser trochanter, via the psoas tendon."
      actions: "Flexes the hip; with the femur fixed, tilts the pelvis anteriorly."
      role: "Partner of psoas in all hip flexion; tight hip flexors tilt the pelvis forward in warrior I and arch the lower back in backbends."
      train: "As psoas."
      asanas: "As psoas."
      myth: "“Hip flexors are always tight in desk workers.” Sitting shortens the hip flexors while you sit; whether this produces lasting tightness varies greatly between people."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.35, ant, 0.2], to: [th1, 0.1, mid], w: 2.2, kind: active}]}
    - name: Gluteus maximus
      latin: m. gluteus maximus
      origin: "Posterior ilium, dorsal surface of the sacrum and coccyx, sacrotuberous ligament, thoracolumbar fascia."
      insertion: "Iliotibial tract (most fibres) and gluteal tuberosity of the femur."
      actions: "Extends the hip, powerfully from a flexed position; externally rotates the thigh; upper fibres abduct. Stabilises the pelvis and, through the iliotibial tract, the knee."
      role: "Works in bridge, locust, warrior and rising from a squat; lengthened in forward bends, child’s pose and pigeon."
      train: "Bridge, locust, chair, warrior III; lengthened in paścimottānāsana and knee-to-chest."
      asanas: "Setu bandha, śalabhāsana (working); paścimottānāsana, bālāsana (lengthening)."
      myth: "“Always squeeze — or never squeeze — the buttocks in backbends.” Moderate activation assists hip extension; hard gripping externally rotates the thighs and may compress the lower back. Teach balance, not a rule."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.35, post], to: [th1, 0.25, post], w: 3.2, kind: active}]}
    - name: Gluteus medius and minimus
      latin: mm. gluteus medius et minimus
      origin: "Outer surface of the ilium, between the gluteal lines."
      insertion: "Greater trochanter of the femur (medius: lateral surface; minimus: anterior surface)."
      actions: "Abduct the hip; anterior fibres rotate the thigh internally, posterior fibres of medius externally. Crucially, they hold the pelvis level when standing on one leg."
      role: "The key stabilisers in every one-legged balance; work in triangle and warrior II; weakness shows as the pelvis dropping on the lifted-leg side."
      train: "Tree, warrior III, half-moon, side-lying leg lifts."
      asanas: "Vṛkṣāsana, vīrabhadrāsana III, ardha candrāsana."
      myth: "“You can stretch the IT band.” The iliotibial tract is extremely stiff connective tissue; stretching and rolling change sensation rather than its length."
      sketch: {pose: front, spindles: [{from: [lt, 0.3, post, 1.4], to: [th1, 0.05, post], w: 2.2, kind: active}]}
    - name: Deep hip rotators
      latin: piriformis, gemelli, obturator internus and externus, quadratus femoris
      origin: "Piriformis: anterior surface of the sacrum. Others: ischium, obturator membrane and the rim of the obturator foramen."
      insertion: "Around the greater trochanter and the trochanteric fossa."
      actions: "Externally rotate the hip and stabilise the femoral head in the socket. Piriformis also abducts the flexed hip; in deep hip flexion its rotational action changes [@neumann2017]."
      role: "Allow the external rotation needed for lotus, butterfly and warrior II; lengthened in pigeon, cow-face and thread-the-needle."
      train: "Lengthened in hip-opening postures; strengthened in standing balance and warrior II."
      asanas: "Gomukhāsana, pigeon preparation, ardha padmāsana."
      myth: "“Sciatica means a tight piriformis.” The sciatic nerve usually passes below piriformis, and piriformis compression is only one uncommon cause of buttock and leg pain; persistent symptoms need medical assessment."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.1, post, 0.6], to: [th1, 0.03, mid], w: 1.6, kind: stretch}]}
    - name: Adductors
      latin: adductor longus, brevis and magnus; pectineus; gracilis
      origin: "Body and inferior ramus of the pubis and the ischial ramus; adductor magnus also from the ischial tuberosity."
      insertion: "Linea aspera of the femur and adductor tubercle; gracilis on the medial tibia (pes anserinus)."
      actions: "Adduct the hip; anterior adductors assist flexion, the ischial part of adductor magnus assists extension; stabilise the pelvis in standing."
      role: "Lengthened in wide-legged postures, triangle and butterfly; work to hold the legs together in headstand and shoulderstand."
      train: "Squeeze a block between the thighs in bridge or boat; lengthen in prasārita pādottānāsana and baddha koṇāsana."
      asanas: "Baddha koṇāsana, upaviṣṭha koṇāsana (lengthening); śīrṣāsana, sarvāṅgāsana (legs together)."
      myth: "“Wide splits are a matter of time.” Bone shape at the hip limits abduction in many people (@ch:skeleton)."
      sketch: {pose: front, spindles: [{from: [lt, 0.0, ant, -0.8], to: [th1, 0.7, ant], w: 2.2, kind: stretch}]}
    - name: Tensor fasciae latae
      latin: m. tensor fasciae latae
      origin: "Anterior superior iliac spine and anterior iliac crest."
      insertion: "Iliotibial tract, which attaches to the lateral condyle of the tibia."
      actions: "Flexes, abducts and internally rotates the hip; tensions the iliotibial tract, stabilising the knee."
      role: "Assists hip flexion in leg raises; lengthened (with other structures) in the back leg of lunges and in cow-face."
      train: "Standing balances; side-lying leg lifts."
      asanas: "Vṛkṣāsana, leg raises."
      myth: "See gluteus medius: the iliotibial tract itself is not meaningfully stretched."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.2, ant, 1.2], to: [th1, 0.3, mid], w: 1.6, kind: active}]}

- id: thigh
  title: Thigh
  muscles:
    - name: Hamstrings
      latin: biceps femoris, semitendinosus, semimembranosus
      origin: "Ischial tuberosity (all three, except the short head of biceps femoris, which arises from the linea aspera of the femur)."
      insertion: "Biceps femoris: head of the fibula. Semitendinosus: upper medial tibia (pes anserinus). Semimembranosus: posterior medial condyle of the tibia."
      actions: "Extend the hip and flex the knee. With the knee flexed, biceps femoris rotates the leg externally and the “semis” internally."
      role: "The main limit to forward bends with straight legs; work in locust, bridge and warrior III. Their upper tendon, at the sitting bone, is vulnerable to overload in aggressive forward bending [@goom2016]."
      train: "Lengthen patiently in forward bends (knees bent if needed); strengthen in bridge, locust and slow lowering from standing forward bends."
      asanas: "Paścimottānāsana, pāda hastāsana, adho mukha śvānāsana, trikoṇāsana (lengthening); setu bandha, śalabhāsana (working)."
      myth: "“Tight hamstrings cause back pain.” Reduced hamstring flexibility is one of several modest predictors of developing back pain in prospective studies [@sadler2017], but back pain has many causes, and many people with tight hamstrings have no back pain (and vice versa)."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.0, post], to: [sh1, 0.06, post], w: 3.0, kind: stretch}]}
    - name: Quadriceps femoris
      latin: rectus femoris, vastus lateralis, medialis and intermedius
      origin: "Rectus femoris: anterior inferior iliac spine and the rim of the acetabulum. Vasti: the shaft of the femur."
      insertion: "Patella and, via the patellar ligament, the tibial tuberosity."
      actions: "Extend the knee; rectus femoris also flexes the hip."
      role: "Engaged to straighten the knees in forward bends (which also relaxes the hamstrings reciprocally); work strongly in chair and warrior; lengthened in bow, camel and hero."
      train: "Chair, warrior, lunges (working); vīrāsana, dhanurāsana, knee-bent lunge (lengthening)."
      asanas: "Utkaṭāsana, vīrabhadrāsana (working); dhanurāsana, uṣṭrāsana (lengthening)."
      myth: "“Lock the knees to straighten the legs.” Straightening is done by the quadriceps; “locking” means pushing into hyperextension, which loads the back of the knee."
      sketch: {pose: tadasana, spindles: [{from: [lt, 0.05, ant, 0.8], to: [sh1, 0.08, ant], w: 3.0, kind: active}]}

- id: leg
  title: Lower leg
  muscles:
    - name: Gastrocnemius
      latin: m. gastrocnemius
      origin: "Medial and lateral condyles of the femur."
      insertion: "Calcaneus, via the Achilles (calcaneal) tendon."
      actions: "Plantarflexes the ankle; flexes the knee."
      role: "Limits dorsiflexion when the knee is straight (heels in downward dog); works in rising onto the toes."
      train: "Lengthen in downward dog with straight knees; strengthen with heel raises."
      asanas: "Adho mukha śvānāsana, pārśvottānāsana (lengthening)."
      myth: "“If your heels don’t touch in downward dog, you’re doing it wrong.” Calf length, ankle shape and proportions vary; heels need not reach the floor."
      sketch: {pose: tadasana, spindles: [{from: [sh1, 0.0, post], to: [sh1, 0.75, post], w: 2.4, kind: stretch}]}
    - name: Soleus
      latin: m. soleus
      origin: "Head and upper shaft of the fibula; soleal line of the tibia."
      insertion: "Calcaneus, via the Achilles tendon."
      actions: "Plantarflexes the ankle (does not cross the knee). A key postural muscle and part of the “muscle pump” returning blood from the legs."
      role: "Limits dorsiflexion when the knee is bent — as in a deep squat or chair pose."
      train: "Lengthen in malāsana and in downward dog with bent knees."
      asanas: "Malāsana, utkaṭāsana."
      myth: "“Calf stretches are all the same.” Straight-knee stretches bias gastrocnemius; bent-knee stretches bias soleus."
      sketch: {pose: tadasana, spindles: [{from: [sh1, 0.2, post, 0.5], to: [sh1, 0.85, post], w: 1.8, kind: stretch}]}
    - name: Tibialis anterior
      latin: m. tibialis anterior
      origin: "Lateral condyle and upper lateral surface of the tibia; interosseous membrane."
      insertion: "Medial cuneiform and base of the first metatarsal."
      actions: "Dorsiflexes and inverts the foot; supports the medial arch."
      role: "Draws the toes towards the shins (“flex the feet”) in daṇḍāsana and paścimottānāsana; lengthened when kneeling on the tops of the feet."
      train: "Toe lifts; lengthen in vajrāsana."
      asanas: "Vajrāsana, vīrāsana (lengthening); daṇḍāsana (working)."
      myth: "“Kneeling postures are bad for the feet.” Most people adapt well; those who cannot tolerate them can place a rolled blanket under the ankles."
      sketch: {pose: tadasana, spindles: [{from: [sh1, 0.1, ant], to: [sh1, 0.95, ant], w: 1.6, kind: active}]}

- id: shoulder
  title: Shoulder girdle and arm
  intro: "In yoga the arms are often weight-bearing; the shoulder’s stability then depends on the coordinated work of the muscles below."
  muscles:
    - name: Latissimus dorsi
      latin: m. latissimus dorsi
      origin: "Spinous processes of T7–T12, thoracolumbar fascia, iliac crest and lower three or four ribs."
      insertion: "Floor of the intertubercular (bicipital) groove of the humerus."
      actions: "Extends, adducts and internally rotates the humerus; depresses the shoulder girdle."
      role: "When short it limits arms overhead — in hasta uttānāsana, downward dog and headstand — and students compensate by arching the lower back; works in chaturaṅga and plank."
      train: "Lengthen in child’s pose with arms extended and in side bends; strengthen in plank and in pressing up from the floor."
      asanas: "Adho mukha śvānāsana, bālāsana with arms forward (lengthening); chaturaṅga (working)."
      myth: "“Limited overhead reach is always a shoulder-joint problem.” Latissimus, thoracic stiffness and rib position often limit it."
      sketch: {pose: arm_up, spindles: [{from: [lt, 0.8, post], to: [ua1, 0.12, mid], w: 2.6, kind: stretch}]}
    - name: Trapezius
      latin: m. trapezius
      origin: "External occipital protuberance and superior nuchal line; ligamentum nuchae; spinous processes of C7–T12."
      insertion: "Lateral third of the clavicle; acromion and spine of the scapula."
      actions: "Upper fibres: elevate and upwardly rotate the scapula. Middle fibres: retract it. Lower fibres: depress and upwardly rotate it."
      role: "Upper and lower fibres together rotate the scapula upward to lift the arms overhead. The cue “shoulders away from the ears” is helpful in plank, but when the arms are fully overhead the upper trapezius *must* work — forcing the shoulders down then blocks upward rotation."
      train: "Arms-overhead postures; headstand; locust with arms forward."
      asanas: "Śīrṣāsana, hasta uttānāsana, vīrabhadrāsana I."
      myth: "“The upper trapezius should always be relaxed.” It has an essential job in overhead movement."
      sketch: {pose: tadasana, spindles: [{from: [nk, 0.8, post], to: [ut, 0.4, post], w: 2.2, kind: active}]}
    - name: Rhomboids
      latin: mm. rhomboidei major et minor
      origin: "Spinous processes of C7–T5 (minor: C7–T1; major: T2–T5)."
      insertion: "Medial border of the scapula."
      actions: "Retract, elevate and downwardly rotate the scapula."
      role: "Draw the shoulder blades together when the hands are clasped behind the back, in bow and locust; lengthened in eagle arms and in the protraction of plank."
      train: "Locust with arms back; lengthen in garuḍāsana arms."
      asanas: "Dhanurāsana, śalabhāsana (working); garuḍāsana (lengthening)."
      myth: "“Always squeeze the shoulder blades together for good posture.” Healthy shoulders move freely between protraction and retraction."
      sketch: {pose: tadasana, spindles: [{from: [ut, 0.62, post, 0.5], to: [ut, 0.9, post, 1.1], w: 1.6, kind: active}]}
    - name: Serratus anterior
      latin: m. serratus anterior
      origin: "Outer surfaces of ribs 1–8 or 9."
      insertion: "Costal (front) surface of the medial border of the scapula."
      actions: "Protracts the scapula and rotates it upward; holds it against the rib cage. Weakness causes “winging”."
      role: "The muscle behind “push the floor away” in plank, downward dog, crow and headstand; essential for lifting the arms overhead."
      train: "Plank and push-back to downward dog; tabletop with protraction; crow."
      asanas: "Adho mukha śvānāsana, kākāsana, plank."
      myth: "“Collapsing between the shoulder blades in plank is a flexibility issue.” It usually reflects serratus weakness or fatigue."
      sketch: {pose: arm_forward, spindles: [{from: [ut, 0.3, ant], to: [ut, 0.85, post], w: 2.6, kind: active}]}
    - name: Rotator cuff
      latin: supraspinatus, infraspinatus, teres minor, subscapularis
      origin: "Supraspinous, infraspinous and subscapular fossae and the lateral border of the scapula."
      insertion: "Greater tubercle of the humerus (supraspinatus, infraspinatus, teres minor) and lesser tubercle (subscapularis)."
      actions: "Supraspinatus assists abduction; infraspinatus and teres minor rotate the humerus externally; subscapularis rotates it internally. Together they compress the humeral head into its shallow socket — the key to shoulder stability."
      role: "Stabilise the shoulder in all weight-bearing postures; overloaded by repeated, poorly controlled chaturaṅga."
      train: "Plank and forearm plank holds; slow, controlled chaturaṅga with knees down; external-rotation work."
      asanas: "Plank, dolphin, headstand preparation."
      myth: "“If you can do it, your shoulders are fine.” Rotator-cuff irritation often builds silently through repetition; volume and quality matter."
      sketch: {pose: tadasana, spindles: [{from: [ut, 0.7, post, 0.8], to: [ua1, 0.08, post], w: 2.0, kind: active}]}
    - name: Pectoralis major and minor
      latin: mm. pectoralis major et minor
      origin: "Major: medial clavicle, sternum, costal cartilages 1–6. Minor: ribs 3–5."
      insertion: "Major: lateral lip of the intertubercular groove of the humerus. Minor: coracoid process of the scapula."
      actions: "Major: adducts and internally rotates the humerus; clavicular fibres flex it. Minor: draws the scapula forward and down; assists forced inspiration."
      role: "Work in chaturaṅga and crow; lengthened in fish, in hands clasped behind the back and in wheel."
      train: "Lengthen in matsyāsana and in doorway or wall chest openers."
      asanas: "Matsyāsana, clasped-hands forward bend (lengthening); chaturaṅga (working)."
      myth: "“Round shoulders are caused by tight pecs.” Posture reflects habit, comfort and many tissues; stretching alone rarely changes it."
      sketch: {pose: arm_forward, spindles: [{from: [ut, 0.55, ant], to: [ua1, 0.25, mid], w: 2.6, kind: stretch}]}
    - name: Deltoid
      latin: m. deltoideus
      origin: "Lateral third of the clavicle; acromion; spine of the scapula."
      insertion: "Deltoid tuberosity of the humerus."
      actions: "Anterior fibres: flex and internally rotate the arm. Middle fibres: abduct it. Posterior fibres: extend and externally rotate it."
      role: "Lifts and holds the arms in warrior II, triangle and all overhead postures."
      train: "Warrior II holds, arm raises."
      asanas: "Vīrabhadrāsana II, trikoṇāsana."
      myth: "—"
      sketch: {pose: arm_forward, spindles: [{from: [ut, 0.92, mid], to: [ua1, 0.45, mid], w: 2.4, kind: active}]}
    - name: Biceps brachii
      latin: m. biceps brachii
      origin: "Short head: coracoid process. Long head: supraglenoid tubercle of the scapula."
      insertion: "Radial tuberosity and, via the bicipital aponeurosis, the forearm fascia."
      actions: "Flexes the elbow; supinates the forearm; weakly flexes the shoulder."
      role: "Lengthened in binds and when the arms are extended behind; works to hold the elbow bent in crow."
      train: "—"
      asanas: "Clasped hands behind the back (lengthening)."
      myth: "—"
      sketch: {pose: arm_forward, spindles: [{from: [ua1, 0.1, ant], to: [fa1, 0.12, ant], w: 1.8, kind: active}]}
    - name: Triceps brachii
      latin: m. triceps brachii
      origin: "Long head: infraglenoid tubercle of the scapula. Lateral and medial heads: posterior humerus."
      insertion: "Olecranon of the ulna."
      actions: "Extends the elbow; the long head also extends and adducts the shoulder."
      role: "Controls the lowering in chaturaṅga (eccentric) and holds the bent arms in crow; lengthened in the top arm of cow-face."
      train: "Chaturaṅga with knees down; dolphin push-ups."
      asanas: "Chaturaṅga, kākāsana (working); gomukhāsana (lengthening)."
      myth: "—"
      sketch: {pose: arm_forward, spindles: [{from: [ua1, 0.05, post], to: [fa1, 0.04, post], w: 1.8, kind: active}]}
    - name: Forearm flexors and extensors
      latin: flexor and extensor groups of the forearm
      origin: "Flexors: common flexor origin on the medial epicondyle of the humerus. Extensors: common extensor origin on the lateral epicondyle."
      insertion: "Carpal bones, metacarpals and phalanges."
      actions: "Flex or extend the wrist and fingers."
      role: "In weight-bearing on the hands, gripping the floor with the fingertips and finger-pads recruits the flexors and takes load off the extended wrist; the flexors are lengthened in plank and downward dog."
      train: "Gradually increasing time on the hands; fist and fingertip variations; wrist mobility."
      asanas: "Plank, adho mukha śvānāsana, kākāsana."
      myth: "“Wrist pain in plank means weak wrists.” Load distribution, wrist extension range and gradual adaptation all matter (@ch:safety)."
      sketch: {pose: arm_forward, spindles: [{from: [fa1, 0.02, ant], to: [fa1, 0.85, ant], w: 1.4, kind: active}]}

- id: neck
  title: Neck
  muscles:
    - name: Sternocleidomastoid
      latin: m. sternocleidomastoideus
      origin: "Manubrium of the sternum and medial clavicle."
      insertion: "Mastoid process and superior nuchal line of the skull."
      actions: "One side: tilts the head to the same side and turns the face to the opposite side. Both sides: flex the neck; assist forced inspiration."
      role: "Lifts the head from the floor in supine postures; lengthened in fish and when the head turns in twists."
      train: "Supine head lifts; lengthen with gentle neck rotations."
      asanas: "Matsyāsana, jālandhara bandha (lengthening)."
      myth: "“Neck tension means the neck is weak.” Tension often comes from breathing with the accessory muscles or from habitual posture."
      sketch: {pose: tadasana, spindles: [{from: [ut, 0.97, ant], to: [nk, 1.0, post], w: 1.3, kind: active}]}
    - name: Scalenes
      latin: mm. scaleni anterior, medius et posterior
      origin: "Transverse processes of the cervical vertebrae (C2–C7)."
      insertion: "First rib (anterior and middle scalene) and second rib (posterior scalene)."
      actions: "Raise the first two ribs (accessory inspiration); flex the neck laterally."
      role: "Overactive in upper-chest or “clavicular” breathing; the nerves to the arm (brachial plexus) pass between the anterior and middle scalenes."
      train: "Slow abdominal and full yogic breathing reduce reliance on them."
      asanas: "Prāṇāyāma; side neck stretches."
      myth: "—"
      sketch: {pose: tadasana, spindles: [{from: [nk, 0.7, mid], to: [ut, 0.95, ant, 0.5], w: 1.1, kind: active}]}
    - name: Levator scapulae
      latin: m. levator scapulae
      origin: "Transverse processes of C1–C4."
      insertion: "Superior angle and upper medial border of the scapula."
      actions: "Elevates the scapula and rotates it downward; laterally flexes the neck."
      role: "Often tense in “shoulders up to the ears”; lengthened in neck side-bends with the head turned slightly down."
      train: "Lengthen gently; learn to release shoulder elevation in postures."
      asanas: "Neck release sequence; relaxation."
      myth: "—"
      sketch: {pose: tadasana, spindles: [{from: [nk, 0.8, post], to: [ut, 0.85, post, 0.8], w: 1.2, kind: active}]}
    - name: Suboccipitals and deep neck flexors
      latin: rectus capitis and obliquus capitis; longus colli and longus capitis
      origin: "Suboccipitals: atlas (C1) and axis (C2). Deep flexors: front of the cervical and upper thoracic vertebrae."
      insertion: "Suboccipitals: occipital bone and atlas. Deep flexors: occipital bone and upper cervical vertebrae."
      actions: "Suboccipitals: fine extension and rotation of the head; rich in proprioceptors. Deep neck flexors: flex and stabilise the cervical spine."
      role: "“Lengthen the back of the neck” and the chin tuck of jālandhara bandha use the deep flexors and release the suboccipitals; they help protect the neck in shoulderstand preparation."
      train: "Gentle chin nods lying supine; jālandhara bandha."
      asanas: "Jālandhara bandha, sarvāṅgāsana preparation."
      myth: "—"
      sketch: {pose: tadasana, spindles: [{from: [nk, 0.3, ant, 0.3], to: [nk, 1.0, ant, 0.3], w: 1.0, kind: active}]}
