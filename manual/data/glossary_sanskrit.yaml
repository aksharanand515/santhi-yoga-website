# Sanskrit glossary (IAST). dev = Devanāgarī.
- {term: abhiniveśa, dev: अभिनिवेश, def: "Clinging to life; fear of death. The fifth kleśa (YS 2.9)."}
- {term: abhyāsa, dev: अभ्यास, def: "Practice; steady, repeated effort (YS 1.12–14)."}
- {term: adhikāra, dev: अधिकार, def: "Eligibility or readiness of a student for a particular teaching."}
- {term: adhyāsa, dev: अध्यास, def: "Superimposition; in Advaita Vedānta, the mistaken projection of the properties of one thing onto another."}
- {term: advaita, dev: अद्वैत, def: "Non-duality; the school of Vedānta taught by Śaṅkara."}
- {term: ahaṃkāra, dev: अहंकार, def: "The “I-maker”; the sense of individual identity and ownership."}
- {term: ahiṃsā, dev: अहिंसा, def: "Non-harming; the first yama."}
- {term: ājñā cakra, dev: आज्ञा, def: "The “command” centre between the eyebrows."}
- {term: ānandamaya kośa, dev: आनन्दमय, def: "The sheath of bliss; the causal body."}
- {term: anāhata cakra, dev: अनाहत, def: "The heart centre; “unstruck” (sound)."}
- {term: annamaya kośa, dev: अन्नमय, def: "The food sheath; the physical body."}
- {term: antaḥkaraṇa, dev: अन्तःकरण, def: "The “inner instrument”: manas, buddhi, ahaṃkāra and citta."}
- {term: antaraṅga, dev: अन्तरङ्ग, def: "“Inner limb”; dhāraṇā, dhyāna and samādhi (YS 3.7)."}
- {term: anuloma viloma, dev: अनुलोम विलोम, def: "Alternate-nostril breathing, in the Sivananda tradition usually with retention."}
- {term: aparigraha, dev: अपरिग्रह, def: "Non-possessiveness, non-grasping; the fifth yama."}
- {term: apāna, dev: अपान, def: "The downward and outward vāyu, governing elimination."}
- {term: āsana, dev: आसन, def: "Seat; posture. The third limb of Patañjali’s yoga."}
- {term: asmitā, dev: अस्मिता, def: "“I-am-ness”; identification of the seer with the instrument of seeing (YS 2.6)."}
- {term: aṣṭāṅga, dev: अष्टाङ्ग, def: "“Eight-limbed”; Patañjali’s eight limbs of yoga."}
- {term: asteya, dev: अस्तेय, def: "Non-stealing; the third yama."}
- {term: ātman, dev: आत्मन्, def: "The Self; in Vedānta, identical with brahman."}
- {term: avidyā, dev: अविद्या, def: "Ignorance, misapprehension; the root kleśa (YS 2.4–5)."}
- {term: bandha, dev: बन्ध, def: "Lock; a sustained contraction used to direct prāṇa (mūla, uḍḍīyāna, jālandhara)."}
- {term: bhakti, dev: भक्ति, def: "Devotion; the path of love for the divine."}
- {term: bhastrikā, dev: भस्त्रिका, def: "“Bellows”; a forceful breathing practice."}
- {term: bhrāmarī, dev: भ्रामरी, def: "“Bee”; the humming breath."}
- {term: bīja, dev: बीज, def: "Seed; a one-syllable seed mantra, e.g. laṃ, vaṃ, raṃ."}
- {term: brahmacarya, dev: ब्रह्मचर्य, def: "“Conduct in brahman”; sexual restraint and moderation; the fourth yama."}
- {term: brahman, dev: ब्रह्मन्, def: "The ultimate reality, ground of all being."}
- {term: buddhi, dev: बुद्धि, def: "Intellect; the discriminating, deciding faculty."}
- {term: cakra, dev: चक्र, def: "Wheel; a centre in the subtle body where nāḍīs converge."}
- {term: cin mudrā, dev: चिन्मुद्रा, def: "Hand gesture with index finger and thumb joined, palms down."}
- {term: citta, dev: चित्त, def: "The mind-field; in the Yoga Sūtra, the whole of mental activity."}
- {term: darśana, dev: दर्शन, def: "“Seeing”; a school of Indian philosophy."}
- {term: dhāraṇā, dev: धारणा, def: "Concentration; binding the mind to one place (YS 3.1). The sixth limb."}
- {term: dharma, dev: धर्म, def: "Duty, righteousness, the right order of things; one’s own path of duty (svadharma)."}
- {term: dhyāna, dev: ध्यान, def: "Meditation; the uninterrupted flow of awareness to one object (YS 3.2). The seventh limb."}
- {term: dṛṣṭi, dev: दृष्टि, def: "Gaze; a point of visual focus."}
- {term: duḥkha, dev: दुःख, def: "Suffering, unsatisfactoriness."}
- {term: dveṣa, dev: द्वेष, def: "Aversion; the fourth kleśa (YS 2.8)."}
- {term: guṇa, dev: गुण, def: "Quality or strand of nature: sattva, rajas, tamas."}
- {term: guru, dev: गुरु, def: "Teacher; traditionally, “dispeller of darkness”."}
- {term: haṭha, dev: हठ, def: "Force; the yoga that uses body, breath and prāṇa as its means."}
- {term: iḍā, dev: इडा, def: "The left, “lunar” nāḍī, associated with the left nostril."}
- {term: īśvara, dev: ईश्वर, def: "The Lord; in the Yoga Sūtra a special puruṣa untouched by affliction."}
- {term: īśvara-praṇidhāna, dev: ईश्वरप्रणिधान, def: "Devotion or surrender to Īśvara; the fifth niyama."}
- {term: jālandhara bandha, dev: जालन्धर बन्ध, def: "The chin lock."}
- {term: japa, dev: जप, def: "Repetition of a mantra."}
- {term: jñāna, dev: ज्ञान, def: "Knowledge; the path of knowledge and discrimination."}
- {term: jñāna mudrā, dev: ज्ञानमुद्रा, def: "Hand gesture with index finger and thumb joined, palms up."}
- {term: kaivalya, dev: कैवल्य, def: "“Aloneness”; liberation in Patañjali’s system."}
- {term: kapālabhāti, dev: कपालभाति, def: "“Skull-shining”; rapid active exhalations. One of the ṣaṭkarmas."}
- {term: karma, dev: कर्म, def: "Action, and the law by which actions bear fruit."}
- {term: karma yoga, dev: कर्मयोग, def: "The yoga of selfless action."}
- {term: kīrtan, dev: कीर्तन, def: "Devotional singing, often call and response."}
- {term: kleśa, dev: क्लेश, def: "Affliction; the five roots of suffering (YS 2.3)."}
- {term: kośa, dev: कोश, def: "Sheath; one of the five layers of the person (Taittirīya Upaniṣad)."}
- {term: kriyā, dev: क्रिया, def: "Action; a practice, especially a cleansing practice."}
- {term: kriyā yoga, dev: क्रियायोग, def: "The yoga of action: tapas, svādhyāya and īśvara-praṇidhāna (YS 2.1)."}
- {term: kumbhaka, dev: कुम्भक, def: "Breath retention (antara, after inhalation; bāhya, after exhalation; kevala, spontaneous)."}
- {term: kuṇḍalinī, dev: कुण्डलिनी, def: "“The coiled one”; the dormant power said to rest at the base of the spine."}
- {term: mahāvākya, dev: महावाक्य, def: "“Great saying”; the four Upaniṣadic statements of the identity of ātman and brahman."}
- {term: mālā, dev: माला, def: "String of beads (usually 108) for counting mantra repetitions."}
- {term: manas, dev: मनस्, def: "Mind; the faculty that receives impressions, doubts and deliberates."}
- {term: maṇipūra cakra, dev: मणिपूर, def: "The navel centre; “city of jewels”."}
- {term: manomaya kośa, dev: मनोमय, def: "The mental sheath."}
- {term: mantra, dev: मन्त्र, def: "Sacred sound, word or verse used in meditation and worship."}
- {term: māyā, dev: माया, def: "The power by which the one appears as many; appearance."}
- {term: mokṣa, dev: मोक्ष, def: "Liberation from the cycle of rebirth."}
- {term: mudrā, dev: मुद्रा, def: "Seal or gesture; hand gestures and Haṭha techniques."}
- {term: mūla bandha, dev: मूलबन्ध, def: "The root lock; contraction of the pelvic floor."}
- {term: mūlādhāra cakra, dev: मूलाधार, def: "The root centre at the base of the spine."}
- {term: nāda, dev: नाद, def: "Sound; the inner sound meditated on in Haṭha Yoga."}
- {term: nāḍī, dev: नाडी, def: "Channel of prāṇa in the subtle body."}
- {term: nāḍī śodhana, dev: नाडीशोधन, def: "“Purification of the channels”; alternate-nostril breathing."}
- {term: niyama, dev: नियम, def: "Observance; the second limb (śauca, santoṣa, tapas, svādhyāya, īśvara-praṇidhāna)."}
- {term: niṣkāma karma, dev: निष्काम कर्म, def: "Action without craving for its fruits (Bhagavad Gītā)."}
- {term: Oṃ, dev: ॐ, def: "The sacred syllable (praṇava), analysed as A-U-M and silence."}
- {term: paramparā, dev: परम्परा, def: "Lineage; the succession of teachers."}
- {term: piṅgalā, dev: पिङ्गला, def: "The right, “solar” nāḍī, associated with the right nostril."}
- {term: prakṛti, dev: प्रकृति, def: "Nature, matter; in Sāṃkhya, all that can be experienced, including the mind."}
- {term: prāṇa, dev: प्राण, def: "Breath, vital energy; also the inward-moving vāyu of the chest."}
- {term: prāṇamaya kośa, dev: प्राणमय, def: "The vital sheath."}
- {term: prāṇāyāma, dev: प्राणायाम, def: "Regulation of the breath; the fourth limb."}
- {term: pratipakṣa-bhāvanam, dev: प्रतिपक्षभावनम्, def: "Cultivating the opposite (YS 2.33)."}
- {term: pratyāhāra, dev: प्रत्याहार, def: "Withdrawal of the senses; the fifth limb."}
- {term: puruṣa, dev: पुरुष, def: "Pure consciousness, the seer; in Sāṃkhya, distinct from prakṛti."}
- {term: rāga, dev: राग, def: "Attachment; the third kleśa (YS 2.7)."}
- {term: rajas, dev: रजस्, def: "The guṇa of activity and passion."}
- {term: rāja yoga, dev: राजयोग, def: "“Royal yoga”; the state of samādhi (Haṭha texts); the eight-limbed path (modern usage)."}
- {term: sādhana, dev: साधन, def: "Spiritual practice."}
- {term: sahasrāra, dev: सहस्रार, def: "The thousand-petalled centre at the crown of the head."}
- {term: sākṣī, dev: साक्षी, def: "The witness; awareness observing all experience."}
- {term: samādhi, dev: समाधि, def: "Absorption; the eighth limb (YS 3.3)."}
- {term: samāna, dev: समान, def: "The balancing vāyu of the navel region, governing digestion."}
- {term: Sāṃkhya, dev: साङ्ख्य, def: "“Enumeration”; the dualist philosophy underlying classical Yoga."}
- {term: saṃskāra, dev: संस्कार, def: "Latent impression left by experience."}
- {term: saṃyama, dev: संयम, def: "Dhāraṇā, dhyāna and samādhi practised together on one object (YS 3.4)."}
- {term: saṅkalpa, dev: सङ्कल्प, def: "Intention or resolve, as used in yoga nidrā."}
- {term: santoṣa, dev: सन्तोष, def: "Contentment; the second niyama."}
- {term: śānti, dev: शान्ति, def: "Peace. The name of the school, from Malayalam ശാന്തി."}
- {term: ṣaṭkarma, dev: षट्कर्म, def: "The six cleansing practices of Haṭha Yoga."}
- {term: sattva, dev: सत्त्व, def: "The guṇa of clarity, lightness and harmony."}
- {term: satya, dev: सत्य, def: "Truthfulness; the second yama."}
- {term: śauca, dev: शौच, def: "Cleanliness, purity; the first niyama."}
- {term: siddhi, dev: सिद्धि, def: "Attainment; an extraordinary power (YS chapter 3)."}
- {term: śraddhā, dev: श्रद्धा, def: "Faith, trust."}
- {term: sthira, dev: स्थिर, def: "Steady, firm (YS 2.46)."}
- {term: sukha, dev: सुख, def: "Ease, comfort, happiness (YS 2.46)."}
- {term: suṣumṇā, dev: सुषुम्णा, def: "The central channel of the subtle body."}
- {term: sūtra, dev: सूत्र, def: "Thread; an aphorism."}
- {term: svādhiṣṭhāna cakra, dev: स्वाधिष्ठान, def: "The sacral centre; “one’s own seat”."}
- {term: svādhyāya, dev: स्वाध्याय, def: "Study; recitation; self-study. The fourth niyama."}
- {term: tamas, dev: तमस्, def: "The guṇa of inertia and heaviness."}
- {term: tapas, dev: तपस्, def: "Heat; disciplined effort; austerity. The third niyama."}
- {term: tattva, dev: तत्त्व, def: "Principle; one of the 25 categories of Sāṃkhya."}
- {term: trāṭaka, dev: त्राटक, def: "Steady gazing, usually at a candle flame."}
- {term: turīya, dev: तुरीय, def: "“The fourth”; pure awareness beyond waking, dreaming and deep sleep."}
- {term: uḍḍīyāna bandha, dev: उड्डीयान बन्ध, def: "The abdominal lock, applied after exhalation."}
- {term: udāna, dev: उदान, def: "The upward vāyu of throat and head."}
- {term: ujjāyī, dev: उज्जायी, def: "“Victorious”; breathing with slight closure of the glottis."}
- {term: Upaniṣad, dev: उपनिषद्, def: "Philosophical texts concluding the Vedas."}
- {term: vairāgya, dev: वैराग्य, def: "Dispassion, detachment (YS 1.15)."}
- {term: vāsanā, dev: वासना, def: "Latent tendency formed from accumulated impressions."}
- {term: vāyu, dev: वायु, def: "Wind; one of the five functions of prāṇa."}
- {term: Veda, dev: वेद, def: "“Knowledge”; the oldest sacred texts of the Hindu tradition."}
- {term: Vedānta, dev: वेदान्त, def: "“End of the Veda”; philosophy based on the Upaniṣads, Gītā and Brahma Sūtras."}
- {term: vijñānamaya kośa, dev: विज्ञानमय, def: "The sheath of discernment."}
- {term: viparītakaraṇī, dev: विपरीतकरणी, def: "“Reversing action”; inverted mudrā, ancestor of shoulderstand."}
- {term: viśuddha cakra, dev: विशुद्ध, def: "The throat centre; “purified”."}
- {term: Viṣṇu mudrā, dev: विष्णुमुद्रा, def: "Hand position for alternate-nostril breathing."}
- {term: viveka, dev: विवेक, def: "Discrimination between the real and the unreal."}
- {term: vṛtti, dev: वृत्ति, def: "Fluctuation or movement of the mind (YS 1.2, 1.5)."}
- {term: vyāna, dev: व्यान, def: "The pervading vāyu, governing circulation and co-ordination."}
- {term: yama, dev: यम, def: "Restraint; the first limb (ahiṃsā, satya, asteya, brahmacarya, aparigraha)."}
- {term: yoga, dev: योग, def: "From *yuj*, to yoke or to be absorbed; both the discipline and its goal."}
- {term: yoga nidrā, dev: योगनिद्रा, def: "“Yogic sleep”; a guided practice of deep relaxation and awareness."}
