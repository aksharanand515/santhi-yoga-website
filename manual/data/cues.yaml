# Teaching cue library: [pose/moment, cue, why / watch for]
- title: Arriving, relaxing and closing
  note: "Speak slowly, leave silence, and lower the pitch slightly. Invite rather than command."
  cues:
    - ["Opening relaxation", "Let the whole weight of the body be taken by the floor.", "Gives permission to release; avoids “relax!” as an order."]
    - ["Opening relaxation", "Notice the breath without changing it.", "Establishes the witnessing attitude used throughout the class."]
    - ["Śavāsana", "Feet a little wider than the hips, arms away from the body, palms up.", "Space between limbs lets the shoulders and legs roll outward and rest."]
    - ["Śavāsana", "If the low back is uncomfortable, bend the knees or place a bolster under them.", "Normalises options; relieves lumbar extension."]
    - ["Final relaxation", "Tense … hold … and let go completely.", "Contrast teaches students to feel the difference between effort and release."]
    - ["Coming out of relaxation", "Begin to deepen the breath. Move fingers and toes. Roll to the right side and rest there.", "Gradual return protects blood pressure and the lower back."]
- title: Breath
  cues:
    - ["Abdominal breathing", "Let the belly rise as you breathe in and fall as you breathe out.", "Simple image of diaphragmatic breathing; hand on abdomen gives feedback."]
    - ["Full yogic breath", "Fill from the bottom up — abdomen, ribs, upper chest — and empty gently.", "Watch for shoulders lifting to the ears."]
    - ["Kapālabhāti", "Short, sharp exhalations from the belly; the inhalation happens by itself.", "The active phase is exhalation; stop if dizzy."]
    - ["Anuloma viloma", "Keep the breath smooth and silent; the count serves the breath, not the reverse.", "Prevents strain and air hunger; retention is optional for beginners."]
    - ["Any posture", "If the breath becomes short or held, you have gone too far — come back a little.", "Breath is the most reliable guide to appropriate effort."]
- title: Sūrya namaskār
  cues:
    - ["Prayer pose", "Stand evenly on both feet; palms together at the chest.", "A still, grounded beginning."]
    - ["Raised arms", "Inhale, arms up; lift the chest more than you bend the back.", "Keeps the extension spread through the thoracic spine."]
    - ["Hand to foot", "Exhale, fold forward from the hips; bend the knees as much as you need.", "Protects the lumbar spine and hamstrings."]
    - ["Lunge", "Step the right foot back; front knee over the ankle; lower the back knee if you like.", "Knee over ankle limits shear; knee-down option for all levels."]
    - ["Eight-limbed pose", "Knees, chest, chin down; hips stay up.", "Beginners may lower the knees first, then chest."]
    - ["Cobra", "Hands under shoulders; lift with the back muscles, elbows soft.", "Avoids pushing into the lumbar spine with the arms."]
    - ["Downward dog", "Press the floor away; lift the hips; heels towards the floor, not necessarily on it.", "Length in the spine is more important than straight legs."]
- title: Headstand and its preparation
  note: "Teach headstand only to students who are ready, step by step, with a clear exit. See @ch:twelve-asanas."
  cues:
    - ["Setting the arms", "Grasp the elbows, then release the hands without moving the elbows; interlace the fingers.", "Sets the forearm width to the shoulders."]
    - ["Head placement", "Crown of the head on the floor, back of the head cradled in the hands.", "Most of the weight should stay on the forearms."]
    - ["Walking in", "Walk the feet towards the face until the hips are over the shoulders.", "Stack before lifting; do not jump."]
    - ["In the pose", "Press the forearms down so the shoulders lift away from the floor.", "Reduces load on the cervical spine."]
    - ["Coming down", "Lower slowly with control, rest in child’s pose for several breaths.", "Allows blood pressure to normalise."]
- title: Shoulderstand, plough and fish
  cues:
    - ["Sarvāṅgāsana", "Hands support the back close to the shoulder blades; elbows no wider than the shoulders.", "Gives a stable base; a folded blanket under the shoulders reduces neck flexion."]
    - ["Sarvāṅgāsana", "Do not turn the head while in the pose.", "Protects the cervical spine."]
    - ["Halāsana", "Feet to the floor only if they reach easily; otherwise rest them on a chair or keep hands on the back.", "Limits end-range cervical flexion."]
    - ["Matsyāsana", "Lift the chest from the elbows; the head rests lightly — the weight is on the elbows.", "Avoids compressing the neck."]
- title: Forward bends
  cues:
    - ["Paścimottānāsana", "Inhale, lengthen the spine; exhale, fold from the hips.", "Hip-hinging protects the discs and lengthens the hamstrings."]
    - ["Paścimottānāsana", "Hold the legs where you comfortably can — the shins or a strap are fine.", "Removes the pressure to reach the feet."]
    - ["Seated forward bends", "Sit on a folded blanket if the lower back rounds.", "Tilts the pelvis forward when the hamstrings are tight."]
    - ["Any forward bend", "Let each exhalation release you a little further — never pull.", "Pulling provokes protective muscle guarding."]
- title: Backbends
  cues:
    - ["Bhujaṅgāsana", "Lift the head and chest with the back muscles; hands light on the floor.", "Builds back strength; protects the low back."]
    - ["Bhujaṅgāsana", "Keep the elbows bent and close to the body; shoulders away from the ears.", "Avoids shrugging and over-extension."]
    - ["Śalabhāsana", "Lengthen the leg back before you lift it.", "Length before height spreads the load."]
    - ["Dhanurāsana", "Kick the feet into the hands to lift the chest.", "The legs do the work; the arms stay straight like ropes."]
    - ["After backbends", "Rest in child’s pose, or lie on the front with head to one side.", "Neutral rest before further work."]
- title: Twists, standing postures and balance
  cues:
    - ["Ardha matsyendrāsana", "Inhale, grow tall; exhale, turn from the belly, then the chest, then the head.", "Rotation distributed along the spine; lengthen before twisting."]
    - ["Ardha matsyendrāsana", "Keep both sitting bones grounded.", "Stabilises the pelvis."]
    - ["Trikoṇāsana", "Reach out along the side before you go down; hand on the shin, block or floor.", "Lateral length before depth; props make the pose accessible."]
    - ["Trikoṇāsana", "Both sides of the waist long.", "Avoids collapsing into the lower side."]
    - ["Vṛkṣāsana", "Foot on the inner calf or thigh — not on the knee.", "Avoids a sideways load on the knee joint."]
    - ["Any balance", "Fix the gaze on one still point at eye level.", "Visual fixation improves balance."]
- title: Arm balances
  cues:
    - ["Kākāsana", "Spread the fingers; knees high on the backs of the upper arms.", "Wide hands and a stable shelf."]
    - ["Kākāsana", "Lean forward until the feet feel light — put a cushion in front of your face.", "Reduces fear of falling."]
    - ["Mayūrāsana", "Elbows into the abdomen, fingers pointing back; lean forward slowly.", "Teach only with good wrist and core preparation."]
- title: Cues to avoid, and what to say instead
  note: "Some familiar cues are unclear, unsafe or not supported by anatomy. Replace them with specific, accurate language."
  cues:
    - ["“Tuck the tailbone”", "Let the tailbone drop slightly towards the heels.", "Aggressive tucking flattens the lumbar curve; ask for a small, neutral adjustment."]
    - ["“Suck the belly in”", "Let the belly be soft, with gentle tone below the navel.", "Rigid gripping restricts diaphragmatic breathing."]
    - ["“Lock the knees”", "Straighten the legs without pushing the knees back.", "Avoids hyperextension, especially in hypermobile students."]
    - ["“Squeeze the glutes” (in backbends)", "Let the buttocks work enough to support the lift.", "Maximal gluteal gripping often turns the thighs out and compresses the low back."]
    - ["“Breathe into your kidneys”", "Feel the back of the ribs expand as you inhale.", "Accurate and still evocative."]
    - ["“This detoxes the liver”", "Many people find twists refreshing.", "Avoid unsupported health claims (@ch:ethics)."]
    - ["“Everyone should be able to…”", "Find the version that suits you today.", "Inclusive, honest, and safer."]
