# Anatomy and physiology glossary
- {term: abduction, def: "Movement away from the midline in the frontal plane."}
- {term: active insufficiency, def: "Inability of a two-joint muscle to shorten fully over both joints at once."}
- {term: active range of motion, def: "The range a person reaches and controls with their own muscles."}
- {term: adduction, def: "Movement towards the midline in the frontal plane."}
- {term: afferent, def: "Carrying signals towards the central nervous system (sensory)."}
- {term: agonist, def: "The muscle chiefly responsible for a movement (prime mover)."}
- {term: alveoli, def: "Tiny air sacs of the lungs where gas exchange occurs."}
- {term: anatomical position, def: "Standing upright, facing forward, feet together, arms by the sides, palms forward; the reference for all anatomical terms."}
- {term: annulus fibrosus, def: "The tough fibrocartilaginous outer ring of an intervertebral disc."}
- {term: antagonist, def: "A muscle opposing the action of the agonist."}
- {term: anterior, def: "Towards the front of the body."}
- {term: ASIS, def: "Anterior superior iliac spine; the front “hip point” of the pelvis."}
- {term: autonomic nervous system, def: "The part of the nervous system regulating organs, vessels and glands; sympathetic and parasympathetic branches."}
- {term: baroreflex, def: "Reflex adjustment of heart rate and vessel tone in response to changes in blood pressure."}
- {term: cervical, def: "Relating to the neck; the seven cervical vertebrae."}
- {term: circumduction, def: "Circular movement combining flexion, abduction, extension and adduction."}
- {term: closed chain, def: "Movement in which the end of the limb is fixed, e.g. against the floor."}
- {term: compression, def: "A load pressing tissues together; a movement limit felt on the side moved towards."}
- {term: concentric contraction, def: "Muscle shortening while producing force."}
- {term: contralateral, def: "On the opposite side."}
- {term: coronal plane, def: "See frontal plane."}
- {term: diaphragm, def: "Dome-shaped muscle between chest and abdomen; the principal muscle of inspiration."}
- {term: distal, def: "Further from the trunk (on a limb)."}
- {term: dorsiflexion, def: "Lifting the top of the foot towards the shin."}
- {term: eccentric contraction, def: "Muscle lengthening while producing force, controlling a movement."}
- {term: efferent, def: "Carrying signals away from the central nervous system (motor)."}
- {term: end range, def: "The last part of a joint’s range, where passive tissues become taut."}
- {term: eversion, def: "Turning the sole of the foot outward."}
- {term: extension, def: "Increasing the angle between segments; returning from flexion (sagittal plane)."}
- {term: facet joint, def: "Zygapophyseal joint; the paired synovial joints between vertebral arches."}
- {term: fascia, def: "Sheets and wrappings of connective tissue around and within muscles and organs."}
- {term: flexion, def: "Decreasing the angle between segments (sagittal plane)."}
- {term: frontal plane, def: "Vertical plane dividing front from back; abduction, adduction and lateral flexion occur in it."}
- {term: functional residual capacity, def: "Air remaining in the lungs after a quiet exhalation."}
- {term: glenohumeral joint, def: "Ball-and-socket joint between the humerus and the glenoid of the scapula."}
- {term: Golgi tendon organ, def: "Sensory receptor in tendons sensitive to tension."}
- {term: heart rate variability, def: "Variation in the interval between heartbeats; reflects autonomic regulation."}
- {term: hyperextension, def: "Extension beyond the neutral or anatomical position."}
- {term: hypermobility, def: "Joint range greater than typical; sometimes part of a connective-tissue disorder."}
- {term: hypocapnia, def: "Low carbon dioxide in the blood, caused by over-breathing."}
- {term: inferior, def: "Towards the feet."}
- {term: interoception, def: "Sense of the internal physiological condition of the body."}
- {term: intra-abdominal pressure, def: "Pressure within the abdominal cavity, raised by diaphragm, abdominal wall and pelvic floor."}
- {term: intraocular pressure, def: "Fluid pressure inside the eye; rises in inverted positions."}
- {term: inversion (foot), def: "Turning the sole of the foot inward."}
- {term: ipsilateral, def: "On the same side."}
- {term: ischial tuberosity, def: "The “sitting bone”; origin of the hamstrings."}
- {term: isometric contraction, def: "Muscle producing force without changing length."}
- {term: kyphosis, def: "A curve convex posteriorly, normal in the thoracic spine."}
- {term: lateral, def: "Away from the midline."}
- {term: lateral flexion, def: "Side-bending of the spine in the frontal plane."}
- {term: ligament, def: "Dense connective tissue joining bone to bone."}
- {term: lordosis, def: "A curve concave posteriorly, normal in the cervical and lumbar spine."}
- {term: lumbar, def: "Relating to the lower back; the five lumbar vertebrae."}
- {term: medial, def: "Towards the midline."}
- {term: meniscus, def: "C-shaped fibrocartilage disc deepening the knee joint."}
- {term: motor unit, def: "A motor neuron and the muscle fibres it controls."}
- {term: muscle spindle, def: "Receptor within muscle sensitive to length and rate of stretch."}
- {term: nucleus pulposus, def: "The gel-like centre of an intervertebral disc."}
- {term: nutation, def: "Small forward nodding movement of the sacrum between the ilia."}
- {term: open chain, def: "Movement in which the end of the limb is free."}
- {term: parasympathetic, def: "Autonomic branch supporting rest, digestion and repair."}
- {term: passive insufficiency, def: "Inability of a two-joint muscle to lengthen fully over both joints at once."}
- {term: passive range of motion, def: "Range reached with external help."}
- {term: pelvic tilt, def: "Forward (anterior) or backward (posterior) rotation of the pelvis on the femoral heads."}
- {term: plantarflexion, def: "Pointing the foot downward."}
- {term: posterior, def: "Towards the back of the body."}
- {term: pronation, def: "Turning the palm downward (forearm)."}
- {term: proprioception, def: "Sense of the position and movement of the body."}
- {term: protraction, def: "Forward movement of the scapula around the rib cage."}
- {term: proximal, def: "Closer to the trunk (on a limb)."}
- {term: PSIS, def: "Posterior superior iliac spine; the “dimples” at the low back."}
- {term: reciprocal inhibition, def: "Reflex relaxation of an antagonist when its agonist contracts."}
- {term: residual volume, def: "Air remaining in the lungs after maximal exhalation."}
- {term: respiratory sinus arrhythmia, def: "Rise in heart rate with inhalation and fall with exhalation."}
- {term: retraction, def: "Backward movement of the scapula towards the spine."}
- {term: rotation, def: "Turning about a long axis (transverse plane)."}
- {term: rotator cuff, def: "Supraspinatus, infraspinatus, teres minor and subscapularis; stabilisers of the shoulder."}
- {term: sacroiliac joint, def: "Joint between the sacrum and ilium; strong, with small movement."}
- {term: sagittal plane, def: "Vertical plane dividing left from right; flexion and extension occur in it."}
- {term: scapulohumeral rhythm, def: "Coordinated movement of scapula and humerus as the arm rises."}
- {term: stabiliser, def: "A muscle holding a segment steady so that movement can occur elsewhere."}
- {term: superior, def: "Towards the head."}
- {term: supination, def: "Turning the palm upward (forearm)."}
- {term: sympathetic, def: "Autonomic branch preparing the body for action."}
- {term: synergist, def: "A muscle assisting the agonist or neutralising unwanted actions."}
- {term: synovial joint, def: "A freely movable joint with a fluid-filled capsule."}
- {term: tendon, def: "Connective tissue joining muscle to bone."}
- {term: tension (tensile load), def: "A load pulling tissues apart; a movement limit felt on the side being lengthened."}
- {term: thoracic, def: "Relating to the chest; the twelve thoracic vertebrae."}
- {term: tidal volume, def: "Air moved in a normal quiet breath (about half a litre)."}
- {term: transverse plane, def: "Horizontal plane dividing upper from lower; rotation occurs in it."}
- {term: vagus nerve, def: "Cranial nerve X; carries most parasympathetic fibres, mostly sensory."}
- {term: vital capacity, def: "Maximum air exhaled after maximal inhalation."}
